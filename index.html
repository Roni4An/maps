<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Атлас мира - Политика, Ресурсы, Энергоресурсы, Рельеф</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            font-family: 'Segoe UI', 'Roboto', 'Arial', sans-serif;
            background: linear-gradient(135deg, #0a1628 0%, #1a2a4a 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .atlas-container {
            max-width: 1300px;
            width: 100%;
            background: rgba(10, 20, 30, 0.8);
            backdrop-filter: blur(3px);
            border-radius: 40px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            padding: 20px;
            border: 2px solid #c9a03d;
        }

        .header {
            text-align: center;
            margin-bottom: 15px;
        }

        .header h1 {
            font-size: 2.2rem;
            background: linear-gradient(135deg, #f5d742, #c99e2f);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .sub {
            color: #b8c7e7;
            font-size: 0.9rem;
        }

        /* Переключатели карт */
        .map-switcher {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .map-btn {
            background: #1e2a3a;
            border: 2px solid #c9a03d;
            color: #e8d5a8;
            font-size: 0.9rem;
            font-weight: bold;
            padding: 8px 20px;
            border-radius: 60px;
            cursor: pointer;
            transition: 0.2s;
        }

        .map-btn.active {
            background: linear-gradient(135deg, #c9a03d, #a07828);
            color: #1a1a2e;
            box-shadow: 0 0 12px rgba(201,160,61,0.5);
        }

        /* Контейнер карты */
        .map-container {
            background: #0a0f1a;
            border-radius: 30px;
            padding: 15px;
            border: 1px solid #c9a03d;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .canvas-container {
            position: relative;
            display: inline-block;
            width: 100%;
            text-align: center;
        }

        canvas {
            display: block;
            max-width: 100%;
            height: auto;
            border-radius: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.5);
            cursor: crosshair;
            margin: 0 auto;
        }

        /* Нижняя панель с кнопками */
        .bottom-bar {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .toggle-btn {
            background: #2c5f8a;
            border: none;
            padding: 8px 20px;
            border-radius: 40px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.9rem;
        }

        .toggle-btn:hover {
            transform: scale(1.02);
            filter: brightness(1.1);
        }

        .toggle-btn.draw-btn {
            background: #467a34;
        }

        .toggle-btn.hint-btn {
            background: #8b5a2b;
        }

        /* Панель рисования (выезжает снизу) */
        .draw-panel {
            margin-top: 15px;
            background: rgba(0, 0, 0, 0.85);
            border-radius: 30px;
            padding: 12px 20px;
            border: 1px solid #c9a03d;
            backdrop-filter: blur(5px);
            display: none;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 15px;
        }

        .draw-panel.open {
            display: flex;
        }

        .draw-section {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(30, 40, 50, 0.6);
            padding: 5px 12px;
            border-radius: 40px;
        }

        .draw-section h4 {
            color: #f5d742;
            font-size: 0.8rem;
        }

        .color-picker {
            display: flex;
            gap: 6px;
        }

        .color-option {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid #fff;
            transition: 0.1s;
        }

        .color-option.active {
            transform: scale(1.15);
            border-color: #ffd700;
            box-shadow: 0 0 5px gold;
        }

        .size-btn {
            background: #2e3a4a;
            border: none;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.7rem;
        }

        .size-btn.active {
            background: #c9a03d;
            color: #1a1a2e;
        }

        .action-btn {
            background: #467a34;
            border: none;
            padding: 5px 12px;
            border-radius: 30px;
            color: white;
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: bold;
        }

        .action-btn.clear-btn {
            background: #8b3a3a;
        }

        .action-btn.save-btn {
            background: #2c5f8a;
        }

        /* Картинка-подсказка */
        .hint-panel {
            margin-top: 15px;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 20px;
            padding: 10px;
            border: 1px solid #c9a03d;
            display: none;
            text-align: center;
        }

        .hint-panel.open {
            display: block;
        }

        .hint-panel img {
            max-width: 100%;
            max-height: 200px;
            border-radius: 15px;
        }

        /* Легенда и информация */
        .legend {
            margin-top: 15px;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 20px;
            padding: 8px 15px;
            border: 1px solid #c9a03d;
        }

        .legend-title {
            color: #f5d742;
            font-weight: bold;
            margin-bottom: 6px;
            text-align: center;
            font-size: 0.85rem;
        }

        .legend-items {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
            color: #ddd;
            font-size: 0.7rem;
        }

        .legend-color {
            width: 14px;
            height: 14px;
            border-radius: 3px;
        }

        .info-panel {
            margin-top: 10px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 15px;
            padding: 6px 12px;
            text-align: center;
            color: #c9d1d9;
            font-size: 0.8rem;
        }

        @media (max-width: 700px) {
            .draw-panel { flex-direction: column; align-items: stretch; }
            .draw-section { justify-content: space-between; }
            .map-btn { padding: 5px 12px; font-size: 0.75rem; }
            .header h1 { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
<div class="atlas-container">
    <div class="header">
        <h1>🌍 МИРОВОЙ АТЛАС 🌏</h1>
        <div class="sub">Исследуй карты • Рисуй • Сохраняй пометки</div>
    </div>

    <div class="map-switcher" id="mapSwitcher">
        <button class="map-btn" data-map="political">🗺️ ПОЛИТИЧЕСКАЯ</button>
        <button class="map-btn active" data-map="resources">⚒️ РЕСУРСЫ</button>
        <button class="map-btn" data-map="fuels">🛢️ ЭНЕРГОРЕСЫ</button>
        <button class="map-btn" data-map="terrain">⛰️ РЕЛЬЕФ</button>
    </div>

    <div class="map-container">
        <div class="canvas-container">
            <canvas id="mapCanvas" width="1000" height="600" style="width:100%; height:auto; max-width:1000px; aspect-ratio:1000/600"></canvas>
        </div>
    </div>

    <!-- Нижние кнопки -->
    <div class="bottom-bar">
        <button class="toggle-btn draw-btn" id="toggleDrawBtn">🎨 РИСОВАНИЕ</button>
        <button class="toggle-btn hint-btn" id="toggleHintBtn">❔ ПОДСКАЗКА</button>
    </div>

    <!-- Панель рисования -->
    <div class="draw-panel" id="drawPanel">
        <div class="draw-section">
            <h4>🎨 Цвет:</h4>
            <div class="color-picker" id="colorPicker">
                <div class="color-option active" style="background:#ff0000;" data-color="#ff0000"></div>
                <div class="color-option" style="background:#00ff00;" data-color="#00ff00"></div>
                <div class="color-option" style="background:#0000ff;" data-color="#0000ff"></div>
                <div class="color-option" style="background:#ffff00;" data-color="#ffff00"></div>
                <div class="color-option" style="background:#ff00ff;" data-color="#ff00ff"></div>
                <div class="color-option" style="background:#ffffff;" data-color="#ffffff"></div>
                <div class="color-option" style="background:#ffa500;" data-color="#ffa500"></div>
                <div class="color-option" style="background:#000000;" data-color="#000000"></div>
            </div>
        </div>
        <div class="draw-section">
            <h4>✏️ Кисть:</h4>
            <button class="size-btn" data-size="3">Малая</button>
            <button class="size-btn active" data-size="6">Средняя</button>
            <button class="size-btn" data-size="12">Большая</button>
        </div>
        <div class="draw-section">
            <button class="action-btn" id="eraserBtn">🧽 ЛАСТИК</button>
            <button class="action-btn clear-btn" id="clearCanvasBtn">🗑 ОЧИСТИТЬ</button>
            <button class="action-btn save-btn" id="saveDrawingBtn">💾 СОХРАНИТЬ PNG</button>
        </div>
    </div>

    <!-- Панель подсказки -->
    <div class="hint-panel" id="hintPanel">
        <img id="hintImage" src="https://media.discordapp.net/attachments/1218513540189782016/1514940289171849296/image-10.png?ex=6a2d3197&is=6a2be017&hm=3798c6408b887f9f26320eef7b82a7a334451a950b7e158480d179cbc3d4f62e&=&format=webp&quality=lossless&width=976&height=669" alt="Подсказка по ресурсам">
    </div>

    <div class="legend" id="legendPanel"></div>
    <div class="info-panel" id="infoPanel">🎨 Нажмите «Рисование» для пометок на карте</div>
</div>

<script>
    // ---------- ИНИЦИАЛИЗАЦИЯ ----------
    const canvas = document.getElementById('mapCanvas');
    const ctx = canvas.getContext('2d');
    
    canvas.width = 1000;
    canvas.height = 600;
    
    let isDrawing = false;
    let currentColor = '#ff0000';
    let currentBrushSize = 6;
    let isErasing = false;
    let currentMap = 'resources';
    
    // Загруженные изображения карт
    const mapImages = {
        political: new Image(),
        resources: new Image(),
        fuels: new Image(),
        terrain: new Image()
    };
    
    // Ссылки на карты (можно заменить на вечные)
    mapImages.political.src = "https://cdn.discordapp.com/attachments/1218513540189782016/1514940215771402313/20_20260612132822.png?ex=6a2d3185&is=6a2be005&hm=b7ffdeca059b0937a2534ba2dba79d5e42de6e803549a85e73c288af3d9f355b";
    mapImages.resources.src = "https://media.discordapp.net/attachments/1369281756275933197/1369405136899670066/image.png?ex=6a2d0faa&is=6a2bbe2a&hm=495b5df89e2754394c56b6868f91a209e11be911f6726ff75c0fe7bd380becf8&=&format=webp&quality=lossless&width=976&height=482";
    mapImages.fuels.src = "https://media.discordapp.net/attachments/1218513540189782016/1514940289968640020/image-9.png?ex=6a2d3197&is=6a2be017&hm=97d5a82d324e759ca585bd15a6eadacd854f585186202a67773e64dfdc5fdd2e&=&format=webp&quality=lossless&width=976&height=482";
    mapImages.terrain.src = "";
    
    let loadedCount = 0;
    const totalMaps = 3;
    
    function checkAllLoaded() {
        loadedCount++;
        if (loadedCount >= totalMaps) drawCurrentMap();
    }
    
    mapImages.political.onload = checkAllLoaded;
    mapImages.resources.onload = checkAllLoaded;
    mapImages.fuels.onload = checkAllLoaded;
    
    if (mapImages.political.complete) loadedCount++;
    if (mapImages.resources.complete) loadedCount++;
    if (mapImages.fuels.complete) loadedCount++;
    
    function drawCurrentMap() {
        const img = mapImages[currentMap];
        if (img && img.src && img.complete) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        } else if (currentMap === 'terrain') {
            ctx.fillStyle = '#2a4a2a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#6a9a6a';
            ctx.font = '24px sans-serif';
            ctx.fillText('🗺️ КАРТА РЕЛЬЕФА', canvas.width/2 - 150, canvas.height/2);
            ctx.fillText('(добавьте своё изображение)', canvas.width/2 - 180, canvas.height/2 + 40);
        } else {
            ctx.fillStyle = '#1a2a3a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#c9a03d';
            ctx.font = '20px sans-serif';
            ctx.fillText('Загрузка карты...', canvas.width/2 - 100, canvas.height/2);
        }
        restoreDrawingForCurrentMap();
    }
    
    // Сохранение рисунков
    function saveDrawingToStorage() {
        localStorage.setItem(`drawing_${currentMap}`, canvas.toDataURL());
    }
    
    function restoreDrawingForCurrentMap() {
        const saved = localStorage.getItem(`drawing_${currentMap}`);
        if (saved) {
            const img = new Image();
            img.onload = () => ctx.drawImage(img, 0, 0);
            img.src = saved;
        }
    }
    
    function clearCurrentDrawing() {
        drawCurrentMap();
        localStorage.removeItem(`drawing_${currentMap}`);
    }
    
    function saveDrawingAsImage() {
        const link = document.createElement('a');
        link.download = `map_${currentMap}_${Date.now()}.png`;
        link.href = canvas.toDataURL();
        link.click();
    }
    
    // Рисование
    function getCanvasCoords(e) {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        let clientX, clientY;
        if (e.touches) {
            clientX = e.touches[0].clientX;
            clientY = e.touches[0].clientY;
            e.preventDefault();
        } else {
            clientX = e.clientX;
            clientY = e.clientY;
        }
        let x = (clientX - rect.left) * scaleX;
        let y = (clientY - rect.top) * scaleY;
        x = Math.max(0, Math.min(canvas.width, x));
        y = Math.max(0, Math.min(canvas.height, y));
        return { x, y };
    }
    
    function draw(e) {
        if (!isDrawing) return;
        e.preventDefault();
        const { x, y } = getCanvasCoords(e);
        ctx.globalCompositeOperation = isErasing ? 'destination-out' : 'source-over';
        ctx.beginPath();
        ctx.arc(x, y, currentBrushSize / 2, 0, Math.PI * 2);
        if (!isErasing) ctx.fillStyle = currentColor;
        ctx.fill();
        ctx.globalCompositeOperation = 'source-over';
    }
    
    function startDrawing(e) { isDrawing = true; draw(e); }
    function stopDrawing() { isDrawing = false; saveDrawingToStorage(); }
    
    canvas.addEventListener('mousedown', startDrawing);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('mouseup', stopDrawing);
    canvas.addEventListener('mouseleave', stopDrawing);
    canvas.addEventListener('touchstart', startDrawing);
    canvas.addEventListener('touchmove', draw);
    canvas.addEventListener('touchend', stopDrawing);
    
    // Интерфейс
    document.querySelectorAll('.color-option').forEach(opt => {
        opt.addEventListener('click', () => {
            document.querySelectorAll('.color-option').forEach(o => o.classList.remove('active'));
            opt.classList.add('active');
            currentColor = opt.dataset.color;
            isErasing = false;
        });
    });
    
    document.querySelectorAll('.size-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentBrushSize = parseInt(btn.dataset.size);
        });
    });
    
    document.getElementById('eraserBtn').addEventListener('click', () => {
        isErasing = true;
        const btn = document.getElementById('eraserBtn');
        btn.style.background = '#c9a03d';
        btn.style.color = '#1a1a2e';
        setTimeout(() => {
            btn.style.background = '#467a34';
            btn.style.color = 'white';
        }, 200);
    });
    
    document.getElementById('clearCanvasBtn').addEventListener('click', () => {
        if (confirm('Очистить все рисунки на этой карте?')) clearCurrentDrawing();
    });
    
    document.getElementById('saveDrawingBtn').addEventListener('click', () => {
        saveDrawingAsImage();
        alert('✅ Рисунок сохранён!');
    });
    
    // Переключение карт
    function setMapType(type) {
        currentMap = type;
        document.querySelectorAll('.map-btn').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.map === type);
        });
        drawCurrentMap();
        updateLegendAndInfo();
    }
    
    function updateLegendAndInfo() {
        const legendPanel = document.getElementById('legendPanel');
        const infoPanel = document.getElementById('infoPanel');
        
        if (currentMap === 'political') {
            legendPanel.innerHTML = `<div class="legend-title">🗺️ ПОЛИТИЧЕСКАЯ КАРТА</div><div class="legend-items"><div class="legend-item"><div class="legend-color" style="background:#2e7d32;"></div><span>Государства</span></div><div class="legend-item"><div class="legend-color" style="background:#d32f2f;"></div><span>Столицы</span></div><div class="legend-item"><div class="legend-color" style="background:#2196f3;"></div><span>Границы</span></div></div>`;
            infoPanel.innerHTML = '🗺️ Политическая карта — границы государств';
        } else if (currentMap === 'resources') {
            legendPanel.innerHTML = `<div class="legend-title">⚒️ КАРТА РЕСУРСОВ</div><div class="legend-items"><div class="legend-item"><div class="legend-color" style="background:#2e7d32;"></div><span>🌲 Лес (дерево) — 500</span></div><div class="legend-item"><div class="legend-color" style="background:#808080;"></div><span>🔩 Вольфрам — 600</span></div><div class="legend-item"><div class="legend-color" style="background:#b87333;"></div><span>🟠 Медь — 400</span></div><div class="legend-item"><div class="legend-color" style="background:#e0e0e0;"></div><span>🧴 Пластик — 300</span></div><div class="legend-item"><div class="legend-color" style="background:#4a6c8f;"></div><span>⚙️ Сталь — 400</span></div></div>`;
            infoPanel.innerHTML = '📊 Карта ресурсов — месторождения: дерево, вольфрам, медь, пластик, сталь';
        } else if (currentMap === 'fuels') {
            legendPanel.innerHTML = `<div class="legend-title">🛢️ КАРТА ЭНЕРГОРЕСУРСОВ</div><div class="legend-items"><div class="legend-item"><div class="legend-color" style="background:#2e7d32;"></div><span>Нефтяные месторождения</span></div><div class="legend-item"><div class="legend-color" style="background:#ff9800;"></div><span>Газовые месторождения</span></div><div class="legend-item"><div class="legend-color" style="background:#9c27b0;"></div><span>Урановые рудники</span></div></div>`;
            infoPanel.innerHTML = '🛢️ Карта энергоресурсов — нефть, газ и уран по всему миру';
        } else {
            legendPanel.innerHTML = `<div class="legend-title">⛰️ КАРТА РЕЛЬЕФА</div><div class="legend-items"><div class="legend-item"><div class="legend-color" style="background:#8B5A2B;"></div><span>Горы</span></div><div class="legend-item"><div class="legend-color" style="background:#228B22;"></div><span>Леса</span></div><div class="legend-item"><div class="legend-color" style="background:#F5DEB3;"></div><span>Пустыни</span></div></div>`;
            infoPanel.innerHTML = '⛰️ Карта рельефа — горные системы, равнины, природные зоны';
        }
    }
    
    document.querySelectorAll('.map-btn').forEach(btn => {
        btn.addEventListener('click', () => setMapType(btn.dataset.map));
    });
    
    // Открытие/закрытие панелей
    const drawPanel = document.getElementById('drawPanel');
    const hintPanel = document.getElementById('hintPanel');
    const toggleDrawBtn = document.getElementById('toggleDrawBtn');
    const toggleHintBtn = document.getElementById('toggleHintBtn');
    
    toggleDrawBtn.addEventListener('click', () => {
        drawPanel.classList.toggle('open');
        toggleDrawBtn.style.background = drawPanel.classList.contains('open') ? '#6ca34d' : '#467a34';
    });
    
    toggleHintBtn.addEventListener('click', () => {
        hintPanel.classList.toggle('open');
        toggleHintBtn.style.background = hintPanel.classList.contains('open') ? '#c97e2a' : '#8b5a2b';
    });
    
    setTimeout(() => drawCurrentMap(), 100);
    updateLegendAndInfo();
</script>
</body>
</html>
